version: 2

project_name: khaos

before:
  hooks:
    - go mod tidy

builds:
  - id: khaos
    main: ./cmd/khaos
    binary: khaos
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Scenarios and compose files are embedded in the binary, so the image needs nothing else.
dockers:
  - image_templates:
      - 'ghcr.io/aleksandarskrbic/khaos:{{ .Version }}-amd64'
      - 'ghcr.io/aleksandarskrbic/khaos:latest-amd64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
  - image_templates:
      - 'ghcr.io/aleksandarskrbic/khaos:{{ .Version }}-arm64'
      - 'ghcr.io/aleksandarskrbic/khaos:latest-arm64'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: 'ghcr.io/aleksandarskrbic/khaos:{{ .Version }}'
    image_templates:
      - 'ghcr.io/aleksandarskrbic/khaos:{{ .Version }}-amd64'
      - 'ghcr.io/aleksandarskrbic/khaos:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/aleksandarskrbic/khaos:latest'
    image_templates:
      - 'ghcr.io/aleksandarskrbic/khaos:latest-amd64'
      - 'ghcr.io/aleksandarskrbic/khaos:latest-arm64'

# NO `brews:` BLOCK ON PURPOSE.
#
# khaos is already in homebrew-core as `khaos` (Formula/k/khaos.rb), built from Go source
# (`depends_on "go" => :build`, no Python/PyPI/librdkafka), so `brew install khaos` works
# today with no tap. Publishing a competing formula to a personal tap would give users two
# different `khaos` packages and is strictly worse. See RUNBOOK.md, "Homebrew".
